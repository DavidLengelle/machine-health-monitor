# machine-health-monitor - industrial predictive-maintenance demo.
#
# Managed with uv:
#   uv sync                                  # create the virtual environment
#   uv run python simulator.py --duration 60 # generate sensor data

[project]
name = "machine-health-monitor"
version = "0.1.0"
description = "Predictive maintenance demo: sensor simulation, anomaly detection and an LLM assistant for factory operators"
readme = "README.md"
requires-python = ">=3.11"

# db.py and simulator.py use the standard library only. detection.py adds the
# data-science stack below. The operator assistant will add its own
# dependencies later (see .env.example for the configuration it expects).
dependencies = [
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]

[tool.uv]
# This is an application, not a distributable package.
package = false
